<!DOCTYPE html>
<html>
<head>

    <title>OCR Text Extractor</title>

    <style>

        body{
            background:#0f172a;
            font-family:Arial;
            color:white;
            text-align:center;
            padding:40px;
        }

        .container{
            width:70%;
            margin:auto;
            background:#1e293b;
            padding:30px;
            border-radius:15px;
        }

        h1{
            color:#38bdf8;
        }

        input{
            margin:20px;
        }

        button{
            background:#38bdf8;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

        textarea{
            width:100%;
            height:250px;
            margin-top:20px;
            padding:15px;
            border-radius:10px;
            font-size:16px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>OCR Text Extractor</h1>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="image" accept=".png,.jpg,.jpeg" required>

        <br>

        <button type="submit">Extract Text</button>

    </form>

    {% if extracted_text %}

        <h2>Extracted Text</h2>

        <textarea readonly>{{ extracted_text }}</textarea>

    {% endif %}

</div>

</body>
</html>
